        /* --- CORE DESIGN SYSTEM --- */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #121826;
            --bg-card: #182032;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #6366f1;
            --accent-primary-glow: rgba(99, 102, 241, 0.35);
            --success-color: #10b981;
            --font-main: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 40%);
            padding: 2rem 1rem;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-card);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- HEADER SECTION --- */
        header {
            text-align: center;
            margin-bottom: 4rem;
            position: relative;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent-primary);
            color: #a5b4fc;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 15px var(--accent-primary-glow);
        }

        header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.15rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        /* --- GRID LAYOUT --- */
        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        /* --- CARDS --- */
        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .button-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .button-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Interactive Canvas */
        .preview-canvas {
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0d131f;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        .preview-canvas::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            pointer-events: none;
        }

        /* Actions Bar */
        .card-actions {
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(24, 32, 50, 0.4);
            gap: 1rem;
        }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            justify-content: center;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border-color: var(--border-hover);
        }

        .action-btn.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--accent-primary);
            color: #a5b4fc;
        }

        /* Code Drawer */
        .code-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #0b0f17;
            border-top: 0 solid var(--border-color);
        }

        .code-drawer.open {
            max-height: 480px;
            border-top-width: 1px;
            overflow-y: auto;
        }

        .drawer-tabs {
            display: flex;
            background-color: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
            padding: 0 1rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 12px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--accent-primary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--accent-primary);
            box-shadow: 0 0 8px var(--accent-primary-glow);
        }

        .drawer-meta {
            padding: 8px 1.5rem;
            background-color: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
            display: flex;
            gap: 8px;
        }

        .drawer-meta-title {
            color: var(--text-secondary);
        }

        .drawer-meta-value {
            color: #a5b4fc;
            font-weight: 500;
        }

        .code-container {
            position: relative;
            padding: 1.5rem;
        }

        .code-panel {
            display: none;
        }

        .code-panel.active {
            display: block;
        }

        pre {
            margin: 0;
            background: transparent !important;
            padding: 0 !important;
        }

        code {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 1.5;
            color: #e2e8f0;
            background: transparent !important;
            display: block;
            overflow-x: auto;
            white-space: pre;
        }

        .copy-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 550;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .copy-btn.copied {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--success-color);
        }

        /* --- TOAST SYSTEM --- */
        #toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 1000;
        }

        .toast {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-success-icon {
            color: var(--success-color);
        }
    </style>
</head>

            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");

            card.className = 'card';
            card.id = `card-${item.id}`;

                <button class="tab-btn" id="tab-css-${item.id}" onclick="switchTab(${item.id}, 'css')">CSS</button>
            `;
            if (item.js) {
                tabsHtml += `
                    <button class="tab-btn" id="tab-js-${item.id}" onclick="switchTab(${item.id}, 'js')">JS</button>
                `;
            }

            let panelsHtml = `
                <div class="code-panel active" id="panel-html-${item.id}">
                    <pre><code class="language-html">${escapeHtml(item.html)}</code></pre>
                </div>
                <div class="code-panel" id="panel-css-${item.id}">
                    <pre><code class="language-css">${escapeHtml(item.css)}</code></pre>
                </div>

                panelsHtml += `
                    <div class="code-panel" id="panel-js-${item.id}">
                        <pre><code class="language-javascript">${escapeHtml(item.js)}</code></pre>
                    </div>
                `;
            }

            if (item.css) {
                const styleEl = document.createElement('style');
                styleEl.innerHTML = item.css;
                document.head.appendChild(styleEl);

                </div>
                <div class="card-actions">
                    <button class="action-btn" onclick="toggleCodeDrawer(${item.id})">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                        Get Code
                    </button>
                </div>
                <div class="code-drawer" id="drawer-${item.id}">
                    <div class="drawer-tabs">
                        ${tabsHtml}
                    </div>
                    <div class="drawer-meta">
                        <span class="drawer-meta-title">Dependencies:</span>
                        <span class="drawer-meta-value">${item.dependencies || 'No Dependency'}</span>
                    </div>
                    <div class="code-container">
                        <button class="copy-btn" onclick="copyCodeSnippet(${item.id})">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            Copy
                        </button>
                        ${panelsHtml}
                    </div>
                </div>
            `;
            gridContainer.appendChild(card);
        });

        const activeTabs = {};
        window.toggleCodeDrawer = function(id) {
            const drawer = document.getElementById(`drawer-${id}`);
            const actionBtn = document.querySelector(`#card-${id} .action-btn`);
            if (!activeTabs[id]) activeTabs[id] = 'html';
            if (drawer.classList.contains('open')) {
                drawer.classList.remove('open');
                actionBtn.classList.remove('active');
            } else {
                document.querySelectorAll('.code-drawer.open').forEach(d => d.classList.remove('open'));
                document.querySelectorAll('.action-btn.active').forEach(b => b.classList.remove('active'));
                drawer.classList.add('open');
                actionBtn.classList.add('active');
            }
        };

        window.switchTab = function(id, tabType) {
            activeTabs[id] = tabType;
            const htmlTab = document.getElementById(`tab-html-${id}`);
            const cssTab = document.getElementById(`tab-css-${id}`);
            const jsTab = document.getElementById(`tab-js-${id}`);
            const htmlPanel = document.getElementById(`panel-html-${id}`);
            const cssPanel = document.getElementById(`panel-css-${id}`);
            const jsPanel = document.getElementById(`panel-js-${id}`);

            if (htmlTab) htmlTab.classList.remove('active');
            if (cssTab) cssTab.classList.remove('active');
            if (jsTab) jsTab.classList.remove('active');
            if (htmlPanel) htmlPanel.classList.remove('active');
            if (cssPanel) cssPanel.classList.remove('active');
            if (jsPanel) jsPanel.classList.remove('active');

            if (tabType === 'html') {
                if (htmlTab) htmlTab.classList.add('active');
                if (htmlPanel) htmlPanel.classList.add('active');
            } else if (tabType === 'css') {
                if (cssTab) cssTab.classList.add('active');
                if (cssPanel) cssPanel.classList.add('active');
            } else if (tabType === 'js') {
                if (jsTab) jsTab.classList.add('active');
                if (jsPanel) jsPanel.classList.add('active');
            }
        };

        window.copyCodeSnippet = function(id) {
            const selectedType = activeTabs[id] || 'html';
            const itemData = FOOTER_DATABASE.find(b => b.id === id);
            if (!itemData) return;
            let textToCopy = '';
            if (selectedType === 'html') textToCopy = itemData.html;
            else if (selectedType === 'css') textToCopy = itemData.css;
            else if (selectedType === 'js') textToCopy = itemData.js;
            const copyBtn = document.querySelector(`#drawer-${id} .copy-btn`);
            navigator.clipboard.writeText(textToCopy).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.innerHTML = `
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--success-color)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Copied!
                `;
                showToast(`Copied Footer #${id} ${selectedType.toUpperCase()} code!`);
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = `
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        Copy
                    `;
                }, 2000);
            });
        };

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <svg class="toast-success-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>${message}</span>
            `;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
